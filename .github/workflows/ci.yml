name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Frontend behavior contracts
        run: node --test tests/web_battle.cjs

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Shell syntax
        run: bash -n run.sh scripts/bootstrap.sh scripts/clean.sh

      - name: Bootstrap pinned engine
        run: ./scripts/bootstrap.sh

      - name: Compile
        run: .venv/bin/python -m compileall -q metro_lab tests examples

      - name: Unit + engine smoke tests
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: External plugin smoke
        run: |
          .venv/bin/mini-metro-arena \
            --plugin examples/nearest_pair_plugin.py \
            --algorithms example-nearest-pair \
            --seeds 42 \
            --minutes 0.02 \
            --no-save \
            --no-replays

      # Small development set only. Archived algorithms keep their reproducible
      # qualification workflow but do not consume long-run CI on unrelated PRs.
      - name: Classic candidate benchmark
        if: github.event_name == 'pull_request'
        run: |
          .venv/bin/mini-metro-arena \
            --scenario classic-v1 \
            --algorithms greedy-v1 balanced-greedy-v2-1 \
            --seeds 1907374266 805162878 657531977 978077348 1255654432 \
            --minutes 15 \
            --no-save

      - name: Stress candidate benchmark
        if: github.event_name == 'pull_request'
        run: |
          .venv/bin/mini-metro-arena \
            --scenario stress-v1 \
            --algorithms greedy-v1 balanced-greedy-v2-1 \
            --seeds 1907374266 805162878 657531977 978077348 1255654432 \
            --minutes 15 \
            --no-save

      - name: HTTP live-view smoke test
        shell: bash
        run: |
          set -euo pipefail
          ./run.sh --no-open --port 18765 > /tmp/mini-metro-lab.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18765/api/state > /tmp/state.json; then
              ok=1
              break
            fi
            sleep 0.2
          done

          if [[ "$ok" != 1 ]]; then
            cat /tmp/mini-metro-lab.log
            exit 1
          fi

          python - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen
          from pathlib import Path

          state = json.loads(Path('/tmp/state.json').read_text())
          assert state['runtime']['algorithm'] == 'Greedy Planner V1'
          assert state['runtime']['scenario_id'] == 'stress-v1'
          assert 0 <= state['runtime']['risk'] <= 100
          assert state['runtime']['passenger_max_wait_time_ms'] > 0
          assert len(state['game']['stations']) >= 2
          assert 'decision' in state
          print('live-view smoke ok:', state['game']['time_ms'], 'ms')

          base = 'http://127.0.0.1:18765'
          def post(command, value=None):
              body = json.dumps({'command': command, 'value': value}).encode()
              with urlopen(Request(base + '/api/battle/control', data=body,
                                   headers={'Content-Type': 'application/json'}), timeout=5) as response:
                  assert json.load(response)['ok']
          post('start', {'left': 'greedy-v1', 'right': 'greedy-v1',
                         'seed': 314, 'dt_ms': 100, 'budget_ms': 300})
          for _ in range(30):
              with urlopen(base + '/api/battle/state', timeout=5) as response:
                  battle = json.load(response)
              if battle['status'] == 'finished':
                  break
              time.sleep(.1)
          assert battle['status'] == 'finished', battle
          assert battle['left']['game']['time_ms'] == battle['right']['game']['time_ms'] == 300
          assert battle['leader'] == 'tie' and battle['delivery_margin'] == 0
          assert battle['left']['progression']['scenario_id'] == 'stress-v1'
          assert battle['right']['progression']['scenario_id'] == 'stress-v1'
          assert 0 <= battle['left']['runtime']['risk'] <= 100
          assert 0 <= battle['right']['runtime']['risk'] <= 100
          session = battle['session_id']
          post('restart')
          with urlopen(base + '/api/battle/state', timeout=5) as response:
              assert json.load(response)['session_id'] == session + 1
          print('HTTP battle smoke ok: fixed dt, stress scenario, wait risk, self-play, restart')
          PY

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: First-run native launcher bootstrap
        shell: cmd
        run: run.cmd --help

      - name: Verify self-contained runtime
        shell: powershell
        run: |
          $expected = '382d7cc65da566ac01d8151921c203c25418eacd'
          if (-not (Test-Path '.tools\uv\uv.exe')) { throw 'project-local uv was not installed' }
          if (-not (Test-Path '.venv\Scripts\python.exe')) { throw 'Windows virtual environment is missing' }
          if (-not (Test-Path '.vendor\python_mini_metro\.mini-metro-engine-commit')) { throw 'engine marker is missing' }
          $actual = (Get-Content -Raw '.vendor\python_mini_metro\.mini-metro-engine-commit').Trim()
          if ($actual -ne $expected) { throw "engine commit mismatch: $actual" }
          .\.venv\Scripts\python.exe -c "import sys; assert sys.version_info[:2] == (3, 13); print(sys.version)"

      - name: Compile on Windows
        shell: powershell
        run: .\.venv\Scripts\python.exe -m compileall -q metro_lab tests examples

      - name: Unit + engine smoke tests on Windows
        shell: powershell
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v

      - name: External plugin smoke on Windows
        shell: powershell
        run: |
          .\.venv\Scripts\mini-metro-arena.exe `
            --plugin examples\nearest_pair_plugin.py `
            --algorithms example-nearest-pair `
            --seeds 42 `
            --minutes 0.02 `
            --no-save `
            --no-replays

      - name: HTTP live-view smoke on Windows
        shell: powershell
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'mini-metro-win.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'mini-metro-win.stderr.log'
          $process = Start-Process `
            -FilePath '.\.venv\Scripts\mini-metro-lab.exe' `
            -ArgumentList @('--no-open', '--port', '18766') `
            -PassThru `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr
          try {
            $state = $null
            for ($i = 0; $i -lt 50; $i++) {
              try {
                $state = Invoke-RestMethod -Uri 'http://127.0.0.1:18766/api/state' -TimeoutSec 2
                break
              }
              catch {
                Start-Sleep -Milliseconds 200
              }
            }
            if ($null -eq $state) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'Windows HTTP server did not become ready'
            }
            if ($state.runtime.algorithm -ne 'Greedy Planner V1') { throw 'unexpected default algorithm' }
            if ($state.runtime.scenario_id -ne 'stress-v1') { throw 'unexpected default scenario' }
            if ($state.game.stations.Count -lt 2) { throw 'engine state is incomplete' }
            Write-Host "Windows HTTP smoke ok: $($state.game.time_ms) ms"
          }
          finally {
            if (-not $process.HasExited) {
              taskkill /PID $process.Id /T /F | Out-Null
            }
          }

      - name: Cleanup smoke on Windows
        shell: cmd
        run: clean.cmd

      - name: Verify cleanup
        shell: powershell
        run: |
          foreach ($path in @('.venv', '.vendor', '.tools', 'output')) {
            if (Test-Path $path) { throw "cleanup left runtime path: $path" }
          }
