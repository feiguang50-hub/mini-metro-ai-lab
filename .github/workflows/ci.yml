name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Frontend behavior contracts
        run: node --test tests/web_battle.cjs

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Shell syntax
        run: bash -n run.sh scripts/bootstrap.sh scripts/clean.sh

      - name: Bootstrap pinned engine
        run: ./scripts/bootstrap.sh

      - name: Compile
        run: .venv/bin/python -m compileall -q metro_lab tests

      - name: Unit + engine smoke tests
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Classic candidate benchmark
        if: github.event_name == 'pull_request'
        run: |
          .venv/bin/mini-metro-arena \
            --scenario classic-v1 \
            --algorithms greedy-v1 balanced-greedy-v2 balanced-greedy-v2-1 \
            --seeds 42 314 2026 4096 65537 \
            --minutes 15 \
            --no-save

      - name: Stress candidate benchmark
        if: github.event_name == 'pull_request'
        run: |
          .venv/bin/mini-metro-arena \
            --scenario stress-v1 \
            --algorithms greedy-v1 balanced-greedy-v2 balanced-greedy-v2-1 \
            --seeds 42 314 2026 4096 65537 \
            --minutes 15 \
            --no-save

      - name: HTTP live-view smoke test
        shell: bash
        run: |
          set -euo pipefail
          ./run.sh --no-open --port 18765 > /tmp/mini-metro-lab.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18765/api/state > /tmp/state.json; then
              ok=1
              break
            fi
            sleep 0.2
          done

          if [[ "$ok" != 1 ]]; then
            cat /tmp/mini-metro-lab.log
            exit 1
          fi

          python - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen
          from pathlib import Path

          state = json.loads(Path('/tmp/state.json').read_text())
          assert state['runtime']['algorithm'] == 'Greedy Planner V1'
          assert state['runtime']['scenario_id'] == 'stress-v1'
          assert 0 <= state['runtime']['risk'] <= 100
          assert state['runtime']['passenger_max_wait_time_ms'] > 0
          assert len(state['game']['stations']) >= 2
          assert 'decision' in state
          print('live-view smoke ok:', state['game']['time_ms'], 'ms')

          base = 'http://127.0.0.1:18765'
          def post(command, value=None):
              body = json.dumps({'command': command, 'value': value}).encode()
              with urlopen(Request(base + '/api/battle/control', data=body,
                                   headers={'Content-Type': 'application/json'}), timeout=5) as response:
                  assert json.load(response)['ok']
          post('start', {'left': 'greedy-v1', 'right': 'greedy-v1',
                         'seed': 314, 'dt_ms': 100, 'budget_ms': 300})
          for _ in range(30):
              with urlopen(base + '/api/battle/state', timeout=5) as response:
                  battle = json.load(response)
              if battle['status'] == 'finished':
                  break
              time.sleep(.1)
          assert battle['status'] == 'finished', battle
          assert battle['left']['game']['time_ms'] == battle['right']['game']['time_ms'] == 300
          assert battle['leader'] == 'tie' and battle['delivery_margin'] == 0
          assert battle['left']['progression']['scenario_id'] == 'stress-v1'
          assert battle['right']['progression']['scenario_id'] == 'stress-v1'
          assert 0 <= battle['left']['runtime']['risk'] <= 100
          assert 0 <= battle['right']['runtime']['risk'] <= 100
          session = battle['session_id']
          post('restart')
          with urlopen(base + '/api/battle/state', timeout=5) as response:
              assert json.load(response)['session_id'] == session + 1
          print('HTTP battle smoke ok: fixed dt, stress scenario, wait risk, self-play, restart')
          PY
