name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Shell syntax
        run: bash -n run.sh scripts/bootstrap.sh scripts/clean.sh

      - name: Bootstrap pinned engine
        run: ./scripts/bootstrap.sh

      - name: Compile
        run: .venv/bin/python -m compileall -q metro_lab tests

      - name: Unit + engine smoke tests
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Candidate benchmark
        if: github.event_name == 'pull_request'
        run: |
          .venv/bin/mini-metro-arena \
            --algorithms greedy-v1 balanced-greedy-v2 \
            --seeds 42 314 2026 4096 65537 \
            --minutes 15 \
            --no-save

      - name: HTTP live-view smoke test
        shell: bash
        run: |
          set -euo pipefail
          ./run.sh --no-open --port 18765 > /tmp/mini-metro-lab.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18765/api/state > /tmp/state.json; then
              ok=1
              break
            fi
            sleep 0.2
          done

          if [[ "$ok" != 1 ]]; then
            cat /tmp/mini-metro-lab.log
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path('/tmp/state.json').read_text())
          assert state['runtime']['algorithm'] == 'Greedy Planner V1'
          assert len(state['game']['stations']) >= 2
          assert 'decision' in state
          print('live-view smoke ok:', state['game']['time_ms'], 'ms')
          PY
