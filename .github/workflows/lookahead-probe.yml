name: stochastic-lookahead-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Bootstrap pinned engine
        run: ./scripts/bootstrap.sh
      - name: Run out-of-sample lookahead probe
        run: |
          .venv/bin/python scripts/run_lookahead_probe.py \
            --seeds 1907374266 805162878 657531977 978077348 1255654432 \
            --points-seconds 180 360 540 \
            --planning-futures 4 \
            --evaluation-futures 8 \
            --horizon-seconds 120 \
            --max-candidates 8
