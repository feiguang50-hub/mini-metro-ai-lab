name: qualification-v2-1

on:
  workflow_dispatch:

jobs:
  frozen-holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Bootstrap pinned engine
        run: ./scripts/bootstrap.sh

      # Historical V2.1 qualification set. These seeds were frozen before the
      # first holdout result was observed and must never be used to tune V2.1.
      # Generated once with:
      # random.Random(20260905).sample(range(1, 2147483647), 20)
      - name: Classic V2.1 frozen holdout
        run: |
          .venv/bin/mini-metro-arena \
            --scenario classic-v1 \
            --algorithms greedy-v1 balanced-greedy-v2-1 \
            --seeds 1261395130 2107621448 580247724 179684729 1540194440 1244916750 1102021607 675561140 1927311155 1022110120 226124509 1678626444 1575673805 1399800420 489765635 88125961 640183564 2024682170 1978872532 444604339 \
            --minutes 15 \
            --no-save

      - name: Stress V2.1 frozen holdout
        run: |
          .venv/bin/mini-metro-arena \
            --scenario stress-v1 \
            --algorithms greedy-v1 balanced-greedy-v2-1 \
            --seeds 1261395130 2107621448 580247724 179684729 1540194440 1244916750 1102021607 675561140 1927311155 1022110120 226124509 1678626444 1575673805 1399800420 489765635 88125961 640183564 2024682170 1978872532 444604339 \
            --minutes 15 \
            --no-save
